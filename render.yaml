services:
  - type: web
    name: ai-prompt-manager
    runtime: php
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: php artisan serve --host=0.0.0.0 --port:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/database.sqlite
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stack
