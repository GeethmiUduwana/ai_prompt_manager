services:
  - type: web
    name: ai-prompt-manager
    runtime: php
    buildCommand: npm install && npm run production && composer install --no-dev --optimize-autoloader && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromDatabase:
          name: ai-prompt-manager-db
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ai-prompt-manager-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-prompt-manager-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ai-prompt-manager-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ai-prompt-manager-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-prompt-manager-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stack

databases:
  - name: ai-prompt-manager-db
    plan: free
    databaseName: ai_prompt_manager
